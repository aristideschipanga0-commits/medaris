<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemilMed — Patologia</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #21262d;
      --accent:    #c8973a;
      --accent2:   #8b5e1a;
      --text:      #e6edf3;
      --muted:     #768390;
      --red:       #da3633;
      --header-h:  64px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      z-index: 100;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      text-decoration: none;
    }
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .brand-sep {
      color: var(--muted);
      font-weight: 300;
      font-size: 1.1rem;
    }
    .brand-module {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(200,151,58,0.12);
      border: 1px solid rgba(200,151,58,0.3);
      border-radius: 999px;
      padding: 0.25rem 0.85rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── IFRAME WRAPPER ── */
    .frame-wrap {
      position: fixed;
      inset: var(--header-h) 0 0 0;
      display: flex;
      flex-direction: column;
    }

    /* top bar above iframe */
    .frame-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1.5rem;
      background: #0d1117;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .file-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.85rem;
      font-size: 0.78rem;
      color: var(--muted);
      font-family: 'DM Mono', 'Fira Code', monospace;
    }
    .file-pill svg { color: var(--accent); flex-shrink: 0; }

    .actions { display: flex; gap: 0.5rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover { background: var(--surface); color: var(--text); border-color: var(--muted); }
    .btn-accent {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #0d1117;
    }
    .btn-accent:hover { background: #d9a84a; }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    /* fallback overlay */
    .fallback {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      background: var(--bg);
      padding: 2rem;
      text-align: center;
    }
    .fallback.visible { display: flex; }
    .fallback-icon { font-size: 3rem; opacity: 0.5; }
    .fallback h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--text);
    }
    .fallback p { font-size: 0.85rem; color: var(--muted); max-width: 380px; line-height: 1.6; }

    /* responsive */
    @media (max-width: 600px) {
      .badge { display: none; }
      .brand-module { display: none; }
      .frame-topbar { padding: 0.4rem 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- ── HEADER ── -->
  <header>
    <a class="brand" href="#">
      <span class="brand-name">DemilMed</span>
      <span class="brand-sep">·</span>
      <span class="brand-module">Patologia · Bloco 2</span>
    </a>
    <span class="badge">Material de Estudo</span>
  </header>

  <!-- ── FRAME AREA ── -->
  <div class="frame-wrap">

    <div class="frame-topbar">
      <div class="file-pill">
        <!-- file icon -->
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        DemilMed_Patologia_Bloco2.html
      </div>

      <div class="actions">
        <a class="btn btn-ghost" href="DemilMed_Patologia_Bloco2.html" target="_blank">
          <!-- external icon -->
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          Abrir em nova aba
        </a>
        <a class="btn btn-accent" href="DemilMed_Patologia_Bloco2.html" download>
          <!-- download icon -->
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download
        </a>
      </div>
    </div>

    <!-- embedded file -->
    <iframe
      id="contentFrame"
      src="DemilMed_Patologia_Bloco2.html"
      title="DemilMed Patologia Bloco 2"
      loading="lazy"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
    ></iframe>

    <!-- fallback shown if iframe fails to load -->
    <div class="fallback" id="fallback">
      <div class="fallback-icon">📄</div>
      <h2>Ficheiro não encontrado</h2>
      <p>
        Certifique-se de que o ficheiro <code>DemilMed_Patologia_Bloco2.html</code>
        está na mesma pasta que este <code>index.html</code> e recarregue a página.
      </p>
      <a class="btn btn-accent" href="DemilMed_Patologia_Bloco2.html" target="_blank">Tentar abrir directamente</a>
    </div>

  </div>

  <script>
    const frame = document.getElementById('contentFrame');
    const fallback = document.getElementById('fallback');

    frame.addEventListener('error', () => {
      frame.style.display = 'none';
      fallback.classList.add('visible');
    });

    // detect blank / 404 pages after load
    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc || doc.title === '404' || doc.body.innerHTML.trim() === '') {
          frame.style.display = 'none';
          fallback.classList.add('visible');
        }
      } catch (e) {
        // cross-origin — assume it loaded fine
      }
    });
  </script>
</body>
</html>
